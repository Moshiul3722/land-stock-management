name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ github.ref == 'refs/heads/demo' && secrets.SSH_HOST || secrets.SSH_HOST_NEW }}
          username: ${{ github.ref == 'refs/heads/demo' && secrets.SSH_USERNAME || secrets.SSH_USERNAME_NEW }}
          key: ${{ github.ref == 'refs/heads/demo' && secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_NEW }}
          port: ${{ github.ref == 'refs/heads/demo' && secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd ${{ github.ref == 'refs/heads/demo' && '/home/texpdyjc/demo.ultracorecreatives.com' || '/home/inventory/inv-land' }}

            # Fetch latest code using GitHub token
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/ultracorecreatives/inv-land.git ${{ github.ref_name }}
            git reset --hard FETCH_HEAD

            # Maintenance mode (optional)
            php artisan down || true

            # Install dependencies
            if command -v composer &> /dev/null; then
              composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f "/opt/cpanel/composer/bin/composer" ]; then
              /usr/local/bin/ea-php82 /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # Run migrations
            php artisan migrate --force

            # Clear caches
            php artisan view:clear
            php artisan route:clear
            php artisan config:clear
            php artisan cache:clear

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix permissions
            chmod -R 775 storage bootstrap/cache

            # Bring app back online
            php artisan up

            echo "✅ Deployment completed successfully!"
