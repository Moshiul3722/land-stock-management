name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_NEW }}
          username: ${{ secrets.SSH_USERNAME_NEW }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NEW }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /home/inventory/inv-land

            # Fetch latest code using GitHub token
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/ultracorecreatives/inv-land.git main
            git reset --hard FETCH_HEAD

            # Maintenance mode (optional)
            php artisan down || true

            # Install dependencies
            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            # Run migrations
            php artisan migrate --force

            # Clear caches
            php artisan view:clear
            php artisan route:clear
            php artisan config:clear
            php artisan cache:clear

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix permissions
            chmod -R 775 storage bootstrap/cache

            # Bring app back online
            php artisan up

            echo "✅ Deployment completed successfully!"
